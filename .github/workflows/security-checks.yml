# Public repositories cannot call the private shared baseline.
name: Security checks
on:
  pull_request:
  schedule:
    - cron: "6 7 * * MON"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets (TruffleHog, verified only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          version: "3.99.7" # in step with the action SHA above
          extra_args: --results=verified
  dependencies:
    name: Dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan lockfiles against OSV
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --format=markdown
            --output=osv-report.md
            ./
      - name: Publish dependency report
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -s osv-report.md ]; then
            cat osv-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dependency report produced; review scanner output and lockfile coverage." >> "$GITHUB_STEP_SUMMARY"
          fi
